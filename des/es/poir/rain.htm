<!DOCTYPE html>
<html>
<head>
    <title>no mountain high enough</title>

    <style>
        @font-face {
            font-family: "Ty";
            src: url("https://desespoir.vercel.app/f/ty.ttf");
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: "Ty", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container {
            position: relative;
            display: inline-block;
            max-width: 90%;
        }

        .image-container img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* full-edge vignette */
        .image-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(to right,
                    #000 0%,
                    transparent 10%,
                    transparent 90%,
                    #000 100%),
                linear-gradient(to bottom,
                    #000 0%,
                    transparent 10%,
                    transparent 90%,
                    #000 100%);
            
            mix-blend-mode: multiply;
        }

        .number {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 50px;
            z-index: 2;
        }
    </style>
</head>

<body>

    <div class="image-container">
        <img src="https://desespoir.vercel.app/des/es/poir/saw.jpg" alt="">
        <div class="number">3</div>
    </div>

    <p>its like a connection</p>
</body>
</html>

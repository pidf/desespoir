<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>emotion</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.room {
    width: 70%;
    max-width: 1000px;
    text-align: center;
}

.image-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
}

.image-wrap img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
}
.level {
    position: absolute;
    top: 25px;
    right: 35px;
    font-family: Georgia, serif;
    font-size: 64px;
    line-height: 1;

    background: linear-gradient(
        to bottom,
        #eee3cc 0%,
        #cdbb9b 35%,
        #fff4dc 50%,
        #b7a482 75%,
        #e3d4b8 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 12px rgba(220, 205, 175, 0.25);
}

.caption {
    margin-top: 28px;
    color: #fff;
    font-size: 25px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="room">

    <div class="image-wrap">
        <img src="https://desespoir.vercel.app/tobe/liveuptoyourself.jpg" alt="">
        <div class="level">5</div>
    </div>

    <div class="caption">
        you're on your own.
    </div>

</div>

</body>
</html>

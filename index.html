<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>desespoir</title>

    <style>
        @font-face {
            font-family: Syam;
            src: url("https://desespoir.vercel.app/f/syam.ttf");
        }

        @font-face {
            font-family: Ty;
            src: url("https://desespoir.vercel.app/f/ty.ttf");
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .xc {
            text-align: center;
        }

        .title {
            font-family: Syam, sans-serif;
            font-size: 120px;
            line-height: 1;
            text-decoration: none;

            background: linear-gradient(
                to bottom,
                #777 25%,
                #fff 50%,
                #777 75%
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            transition: none;
        }

        .title:hover {
            background: linear-gradient(
                to bottom,
                #fff 0%,
                #777 50%,
                #fff 100%
                
            );
            font-weight: lighter;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 25px;
            font-family: Ty, sans-serif;
            font-size: 22px;
            color: #fff;
        }

        .hints { 
            margin-top: 45px;
            font-family: Ty, sans-serif; 
            font-size: 18px; 
        }
        .hints a {
            color: #fff; 
            text-decoration: none; 
        }
        .hints a:hover { 
            text-decoration: underline; 
        } 
        .hints sup { 
            font-size: 10px; 
            margin-left: 2px; 
        }
    </style>
</head>

<body>
    <div class="xc">
        <a class="title" href="https://desespoir.vercel.app/des/es/poir/numberone.htm">desespoir</a>
        <div class="subtitle">click above to begin . . .</div>
    </div>

    <div class="hints">
        <a href="https://desespoir.vercel.app/hintsandrules.html">
            hints and rules
    </div>
    <div class="hints">
        <a href="https://desespoir.vercel.app/s/r.html">
            2
    </div>
    <div class="hints">
        <a href="https://desespoir.vercel.app/hr.html">
            3
    </div>
</body>
</html>
